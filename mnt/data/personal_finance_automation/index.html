<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Personal Finance Bank Connection</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; max-width:760px; margin:50px auto; padding:0 20px; }
    button { padding:12px 18px; font-size:16px; cursor:pointer; margin-right:8px; }
    pre { background:#f5f5f5; padding:15px; border-radius:8px; overflow:auto; }
  </style>
</head>
<body>
  <h1>Personal Finance Bank Connector</h1>
  <p>Connect a bank through Plaid, then sync transactions into SQLite and your V2 Excel workbook.</p>
  <button id="connect">Connect Bank</button>
  <button id="sync">Sync Now</button>
  <pre id="status">Loading...</pre>
<script>
async function status(){
  const r=await fetch('/api/status'); document.getElementById('status').textContent=JSON.stringify(await r.json(),null,2);
}
async function connectBank(){
  const tokenResp=await fetch('/api/create_link_token',{method:'POST'});
  const {link_token}=await tokenResp.json();
  const handler=Plaid.create({token:link_token,onSuccess:async(public_token)=>{
    const r=await fetch('/api/exchange_public_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({public_token})});
    const data=await r.json();
    document.getElementById('status').textContent=JSON.stringify(data,null,2);
    await syncNow();
  },onExit:(err)=>{if(err) console.error(err);}});
  handler.open();
}
async function syncNow(){
  document.getElementById('status').textContent='Syncing...';
  const r=await fetch('/api/sync',{method:'POST'});
  document.getElementById('status').textContent=JSON.stringify(await r.json(),null,2);
}
document.getElementById('connect').onclick=connectBank;
document.getElementById('sync').onclick=syncNow;
status();
</script>
</body>
</html>
